[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flerken-studio-bot"
version = "0.1.0"
description = "A cautious, draft-first Substack newsletter automation bot for Flerken Studio."
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
publish = ["python-substack>=0.2.0"]
test = ["pytest>=8,<9"]

[project.scripts]
flerken-bot = "flerken_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
